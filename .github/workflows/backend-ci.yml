name: Backend CI

on:
  pull_request:
    branches: [dev, main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  push:
    branches: [dev]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test
