spring:
  profiles:
    active: dev
  jackson:
    deserialization:
      # 정수 필드에 소수(예: 5000.9)가 오면 잘라 저장하지 않고 400으로 거부한다.
      accept-float-as-int: false

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:sogogi
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}